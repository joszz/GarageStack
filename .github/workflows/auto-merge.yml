name: Auto-merge Dependabot PRs

on:
  pull_request_target:

permissions:
  pull-requests: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The PR's author, not github.actor (whoever triggered this run), and a branch of this
    # repository rather than a fork: only Dependabot's own PRs get approved and merged.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Approve so branch-protection review requirements don't block --auto merge
      - name: Auto-approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge:
      #   - all patch updates
      #   - all minor updates that belong to a defined group (CI still must pass)
      # Major version bumps are left for manual review, including GitHub Actions updates --
      # Actions run with repo secrets, so they get no blanket exemption from this rule.
      - name: Auto-merge
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' && steps.meta.outputs.dependency-group != '')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
