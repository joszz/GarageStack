name: Preview build

# Publishes images for a pull request labelled test-build, tagged pr-<number>, so someone with the
# car the change is for can run it before it is merged. Every push to the pull request replaces
# them; preview-cleanup.yml deletes them when the label comes off or the pull request closes.
#
# A pull request from a fork gets no packages permission, so the label alone builds nothing
# there. A maintainer reads its changes, then runs this workflow by hand (Run workflow) with the
# pull request number and the commit they read. Only that exact commit is built, and a push to
# the fork afterwards needs a new review and a new run. See documentation/PREVIEW_BUILDS.md.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request from a fork to build (it needs the test-build label)
        type: number
        required: true
      commit:
        description: The full commit of that pull request you reviewed (its head)
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A build by hand: the pull request has to be open, aimed at main, labelled test-build, and
  # still at the commit the maintainer reviewed. docker-publish.yml checks GitHub's merge of it
  # against that commit again when it builds.
  check:
    name: Check pr-${{ inputs.pr_number }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr_number }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check the pull request and the reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be the full 40-character commit, as git rev-parse prints it" >&2
            exit 1
          fi
          PULL=$(gh api "repos/$REPO/pulls/$PR")
          STATE=$(jq -r .state <<< "$PULL")
          BASE=$(jq -r .base.ref <<< "$PULL")
          HEAD=$(jq -r .head.sha <<< "$PULL")
          LABELLED=$(jq -r 'any(.labels[]; .name == "test-build")' <<< "$PULL")
          if [ "$STATE" != open ] || [ "$BASE" != main ]; then
            echo "::error::#$PR is $STATE and aimed at $BASE; only an open pull request to main is built" >&2
            exit 1
          fi
          if [ "$LABELLED" != true ]; then
            echo "::error::#$PR has no test-build label. Add it first, so closing the pull request deletes the images again." >&2
            exit 1
          fi
          if [ "$HEAD" != "$COMMIT" ]; then
            echo "::error::#$PR is at $HEAD now, not $COMMIT. Review the commits since then and run again with the new head." >&2
            exit 1
          fi
          echo "Building #$PR at $COMMIT"

  build:
    name: Publish pr-${{ inputs.pr_number || github.event.pull_request.number }}
    needs: check
    # By hand: once the check passed. On a pull request: only for branches of this repository,
    # since a fork's pull request gets no packages permission. Adding another label to a labelled
    # pull request is not a reason to build again.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' && needs.check.result == 'success' ||
       github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'test-build') &&
       (github.event.action != 'labeled' || github.event.label.name == 'test-build'))
    # Shared with the cleanup, so closing the pull request stops a build that is still pushing.
    concurrency:
      group: preview-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      # fromJSON: a number typed into Run workflow reaches a reusable workflow as text, which its
      # number input refuses before any job starts (the run fails with no job and no log).
      pr_number: ${{ fromJSON(inputs.pr_number || github.event.pull_request.number) }}
      pr_commit: ${{ inputs.commit || '' }}
    secrets: inherit

  comment:
    name: Tell the tester
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: ${{ inputs.commit || github.event.pull_request.head.sha }}
      VERSION: ${{ needs.build.outputs.version }}
      BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # The same commit the build used (the pull request merged into main), with history and
      # tags, to see which migrations it carries that the latest release does not. A build by
      # hand names that merge itself; on a pull request it is the run's own commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.ref }}

      - name: Post or update the preview comment
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- garagestack-preview-build -->'
          SHORT="${HEAD_SHA:0:7}"
          DOCS="https://github.com/$REPO/blob/main/documentation/PREVIEW_BUILDS.md"
          BACKUP="https://github.com/$REPO/blob/main/README.md#backup-and-restore"

          # A tester runs on top of their current release, so a migration counts whether it comes
          # from this pull request or was merged into main after that release. Without any
          # release, every migration counts.
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          BASE="${LATEST:-$(git hash-object -t tree /dev/null)}"
          MIGRATIONS=$(git diff --name-only "$BASE" HEAD -- src/GarageStack.Data/Migrations/ | wc -l)

          {
            echo "$MARKER"
            echo "### Preview build \`pr-$PR\`"
            echo
            echo "Images for this pull request are published, built from $SHORT (version \`$VERSION\`, shown in the footer)."
            if [ "$BY_HAND" = true ]; then
              echo "This pull request comes from a fork, so a maintainer builds it by hand after reading the changes: a push here does not rebuild the images by itself. Closing the pull request or removing the \`test-build\` label deletes them."
            else
              echo "Every push here replaces them. Closing the pull request or removing the \`test-build\` label deletes them."
            fi
            echo
            if [ "$MIGRATIONS" -gt 0 ]; then
              echo "> [!WARNING]"
              if [ -n "$LATEST" ]; then
                SINCE="the latest release (\`$LATEST\`) does not have"
              else
                SINCE="no release has yet"
              fi
              echo "> This build changes the database: it carries database changes that $SINCE."
              echo "> Going back afterwards leaves them in place, so **[back up the database]($BACKUP) before trying it**."
              echo
            fi
            echo "> [!IMPORTANT]"
            if [ -n "$LATEST" ]; then
              echo "> **Update to the latest release (\`${LATEST#v}\`) first** if you run an older version, as a normal update. The preview is built on top of it, the database warning on this comment compares with it, and going back means going back to it."
            fi
            echo "> Switch where you always run GarageStack: the same folder, Portainer stack or Unraid container. Compose names the database volume after the folder or stack, so starting from anywhere else runs on a new, empty database."
            echo "> Don't use \`docker compose down -v\` or \`docker volume prune\` while testing. A [backup]($BACKUP) first never hurts."
            echo
            echo "**All-in-one or Unraid:** change the image to"
            echo
            echo '```'
            echo "ghcr.io/$OWNER/garagestack:pr-$PR"
            echo '```'
            echo
            echo "**Docker Compose:** with this repository's \`docker-compose.yml\`, add \`GARAGESTACK_TAG=pr-$PR\` to your \`.env\`. With your own compose file, change the tag of \`garagestack-api\`, \`garagestack-worker\` and \`garagestack-frontend\` to \`pr-$PR\`. Then"
            echo
            echo '```sh'
            echo "docker compose pull"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "To pin this exact build rather than follow the pull request, use \`pr-$PR-$SHORT\` as the tag."
            echo
            if [ -n "$LATEST" ]; then
              echo "**Going back:** change the tag back to the latest release, \`${LATEST#v}\`. \`latest\` works too: it is always the newest release (with this repository's compose file, remove the \`GARAGESTACK_TAG\` line)."
            else
              echo "**Going back:** change the tag back to the version you ran before."
            fi
            echo
            echo "Step by step: [Testing a preview build]($DOCS#testing-a-preview-build)."
          } > body.md

          ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
