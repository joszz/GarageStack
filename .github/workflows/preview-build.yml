name: Preview build

# Publishes images for a pull request labelled test-build, tagged pr-<number>, so someone with the
# car the change is for can run it before it is merged. Every push to the pull request replaces
# them; preview-cleanup.yml deletes them when the label comes off or the pull request closes.
# See documentation/PREVIEW_BUILDS.md.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Publish pr-${{ github.event.pull_request.number }}
    # Only for branches of this repository: a fork's pull request gets no packages permission.
    # Adding another label to a labelled pull request is not a reason to build again.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'test-build') &&
      (github.event.action != 'labeled' || github.event.label.name == 'test-build')
    # Shared with the cleanup, so closing the pull request stops a build that is still pushing.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  comment:
    name: Tell the tester
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The same commit the build used (the pull request merged into main), with history and
      # tags, to see which migrations it carries that the latest release does not.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Post or update the preview comment
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- garagestack-preview-build -->'
          SHORT="${HEAD_SHA:0:7}"
          DOCS="https://github.com/$REPO/blob/main/documentation/PREVIEW_BUILDS.md"
          BACKUP="https://github.com/$REPO/blob/main/README.md#backup-and-restore"

          # A tester runs on top of their current release, so a migration counts whether it comes
          # from this pull request or was merged into main after that release. Without any
          # release, every migration counts.
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          BASE="${LATEST:-$(git hash-object -t tree /dev/null)}"
          MIGRATIONS=$(git diff --name-only "$BASE" HEAD -- src/GarageStack.Data/Migrations/ | wc -l)

          {
            echo "$MARKER"
            echo "### Preview build \`pr-$PR\`"
            echo
            echo "Images for this pull request are published, built from $SHORT (version \`$VERSION\`, shown in the footer)."
            echo "Every push here replaces them. Closing the pull request or removing the \`test-build\` label deletes them."
            echo
            if [ "$MIGRATIONS" -gt 0 ]; then
              echo "> [!WARNING]"
              if [ -n "$LATEST" ]; then
                SINCE="the latest release (\`$LATEST\`) does not have"
              else
                SINCE="no release has yet"
              fi
              echo "> This build changes the database: it carries database changes that $SINCE."
              echo "> Going back afterwards leaves them in place, so **[back up the database]($BACKUP) before trying it**."
              echo
            fi
            echo "> [!IMPORTANT]"
            if [ -n "$LATEST" ]; then
              echo "> **Update to the latest release (\`${LATEST#v}\`) first** if you run an older version, as a normal update. The preview is built on top of it, the database warning on this comment compares with it, and going back means going back to it."
            fi
            echo "> Switch where you always run GarageStack: the same folder, Portainer stack or Unraid container. Compose names the database volume after the folder or stack, so starting from anywhere else runs on a new, empty database."
            echo "> Don't use \`docker compose down -v\` or \`docker volume prune\` while testing. A [backup]($BACKUP) first never hurts."
            echo
            echo "**All-in-one or Unraid:** change the image to"
            echo
            echo '```'
            echo "ghcr.io/$OWNER/garagestack:pr-$PR"
            echo '```'
            echo
            echo "**Docker Compose with the published images** (your own compose file with \`garagestack-api\`, \`garagestack-worker\` and \`garagestack-frontend\`): change the tag of those three images to \`pr-$PR\`, then"
            echo
            echo '```sh'
            echo "docker compose pull"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "**Docker Compose from a clone of this repository**, in the clone's folder on \`main\`:"
            echo
            echo '```sh'
            echo "git pull"
            echo "PREVIEW_TAG=pr-$PR docker compose -f docker-compose.yml -f docker-compose.preview.yml up -d"
            echo '```'
            echo
            echo "With the bundled database, put \`--profile bundled-postgres\` after \`docker compose\`, as you do for a normal start."
            echo
            echo "To pin this exact build rather than follow the pull request, use \`pr-$PR-$SHORT\` as the tag."
            echo
            if [ -n "$LATEST" ]; then
              echo "**Going back:** change the image back to the latest release, \`${LATEST#v}\`. \`latest\` works too, but it follows \`main\`, so it can hold changes that are not released yet, database ones included. From a clone, run \`docker compose up -d --build\` in the same folder."
            else
              echo "**Going back:** change the image back to the version you ran before. From a clone, run \`docker compose up -d --build\` in the same folder."
            fi
            echo
            echo "Step by step: [Testing a preview build]($DOCS#testing-a-preview-build)."
          } > body.md

          ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
