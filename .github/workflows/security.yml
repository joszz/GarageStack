name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build and publish Docker images"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy (SARIF output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on critical unfixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  # Every image is released for amd64 and arm64, and the two carry different packages, so each
  # architecture is scanned. amd64 keeps the job name and SARIF category it always had, so its
  # existing alerts stay attached.
  trivy-image:
    name: Trivy image scan (${{ matrix.label }}${{ matrix.arch != 'amd64' && format(', {0}', matrix.arch) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # After a publish, and weekly. Not on the push to main itself: every push to main publishes,
    # and a scan started by the push runs while that publish is still building, so it scans the
    # previous :latest (which failed the arm64 leg while :latest was still amd64 only).
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        label: [garagestack, garagestack-frontend, garagestack-api, garagestack-worker]
        arch: [amd64, arm64]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # :latest is a multi-architecture index; this picks the image to scan out of it.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.label }}:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.label }}${{ matrix.arch != 'amd64' && format('-{0}', matrix.arch) || '' }}
