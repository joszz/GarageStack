name: Stale issues and PRs

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stale:
    name: Mark stale
    # The stale policy is for this repository's issues, not a fork's.
    if: github.repository == 'joszz/GarageStack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          # A pull request often waits on review rather than on its author, so it is only ever
          # marked stale, never closed.
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further
            activity occurs. Feel free to re-open it if it is still relevant.
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it is marked
            stale. It will not be closed. If it is still on your mind, a comment
            on where it stands, or a push that brings it up to date with main,
            helps it along.
          close-issue-message: >
            This issue was closed automatically due to inactivity. Please
            re-open if it is still relevant.
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'pinned,security,do-not-merge'
          exempt-all-milestones: true
