name: Build and publish Docker images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches:
      - main
    tags:
      - "v*"
  # On pull requests ci.yml builds every image already; this runs only to try a change to itself.
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docker-publish.yml
  # preview-build.yml calls this for a pull request labelled test-build, so a tester can run the
  # change before it is merged. See documentation/PREVIEW_BUILDS.md.
  workflow_call:
    inputs:
      pr_number:
        description: Pull request to publish preview images for, tagged pr-<number>
        type: number
        required: true
    outputs:
      version:
        description: The version the preview images carry
        value: ${{ jobs.build.outputs.version }}

# A newer push to a PR makes its running build pointless; on main and tags a build is never cut
# off halfway through publishing, the next one waits instead. A preview has a group of its own,
# so it never cancels the run that tries a change to this file on the same pull request.
concurrency:
  group: docker-publish-${{ github.ref }}${{ inputs.pr_number > 0 && '-preview' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default; the build job asks for exactly what publishing and signing need.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.minver.outputs.version }}
    env:
      # Whether images are pushed: always, except on a pull request that is not a preview.
      PUBLISH: ${{ github.event_name != 'pull_request' || inputs.pr_number > 0 }}
      # A preview is a throwaway test build: no SBOM, provenance or signature, which would each
      # leave untagged versions in the registry that the cleanup cannot tell apart.
      RELEASE_GRADE: ${{ github.event_name != 'pull_request' }}
      PR_NUMBER: ${{ inputs.pr_number }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # All-in-one image (frontend + API + worker + postgres + mosquitto + saic gateway)
          - label: all-in-one
            image: garagestack
            context: .
            dockerfile: docker/all-in-one/Dockerfile

          # Individual service images (used with docker-compose)
          - label: frontend
            image: garagestack-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile

          - label: api
            image: garagestack-api
            context: .
            dockerfile: src/GarageStack.Api/Dockerfile

          - label: worker
            image: garagestack-worker
            context: .
            dockerfile: src/GarageStack.Worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || github.token }}"
          echo "$TOKEN" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: GHCR auth preflight
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.image }}"
          SCOPE="repository:${{ github.repository_owner }}/${IMAGE}:pull,push"
          STATUS=$(curl -sS -o /tmp/ghcr-token.json -w "%{http_code}" \
            -u "${{ github.actor }}:${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || github.token }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=${SCOPE}")

          if [ "$STATUS" -ge 400 ] || ! grep -q '"token"' /tmp/ghcr-token.json; then
            echo "::error::GHCR auth preflight failed. Token does not have ghcr pull/push for ${{ github.repository_owner }}/${IMAGE}."
            echo "::error::Check repo Actions permissions (Read and write), package access, or configure GHCR_PAT with write:packages/read:packages."
            cat /tmp/ghcr-token.json
            exit 1
          fi

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compute MinVer version
        id: minver
        shell: bash
        run: |
          # Same MinVer the build uses to stamp the assemblies, read from the central pin so
          # the image tag and the version inside it can never come from different majors.
          MINVER_VERSION=$(sed -n 's/.*Include="MinVer" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)
          if [ -z "$MINVER_VERSION" ]; then
            echo "Could not read the MinVer version from Directory.Packages.props" >&2
            exit 1
          fi
          dotnet tool install --global minver-cli --version "$MINVER_VERSION"
          VERSION=$(minver . -t v -p preview.0 | tail -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "MinVer produced an empty version" >&2
            exit 1
          fi
          # A preview names its pull request in the version, so the footer shows which build runs.
          if [ "${PR_NUMBER:-0}" -gt 0 ]; then
            case "$VERSION" in
              *-*) VERSION="$VERSION.pr.$PR_NUMBER" ;;
              *) VERSION="$VERSION-pr.$PR_NUMBER" ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved MinVer version: $VERSION"

      - name: Compute OS patch date
        id: patchdate
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub (avoids pull rate limits for moby/buildkit)
        if: env.PUBLISH == 'true'
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        if: env.RELEASE_GRADE == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # A preview's commit tag names the pull request's own commit, not GitHub's merge commit.
          DOCKER_METADATA_PR_HEAD_SHA: ${{ inputs.pr_number > 0 }}
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # semver tags from v* git tags: v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # short SHA for traceability on every main push
            type=sha,format=short,enable=${{ !(inputs.pr_number > 0) }}
            # a preview: pr-123 follows the pull request, pr-123-abc1234 is one exact commit
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number > 0 }}
            type=sha,format=short,prefix=pr-${{ inputs.pr_number }}-,enable=${{ inputs.pr_number > 0 }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.RELEASE_GRADE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.RELEASE_GRADE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.minver.outputs.version }}
            OS_PATCH_DATE=${{ steps.patchdate.outputs.date }}
          # Each image gets its own GHA cache scope
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,scope=${{ matrix.label }},mode=min,ignore-error=true

      - name: Sign image with Cosign
        if: env.RELEASE_GRADE == 'true'
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
