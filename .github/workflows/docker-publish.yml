name: Build and publish Docker images

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to rebuild. release rebuilds the newest release and moves latest; main rebuilds edge.
        type: choice
        options: [release, main]
        default: release
  # The weekly rebuild of the newest release, so latest picks up the base images' and the OS
  # packages' security fixes between releases.
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches:
      - main
    tags:
      - "v*"
  # On pull requests ci.yml builds every image already; this runs only to try a change to itself.
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docker-publish.yml
  # preview-build.yml calls this for a pull request labelled test-build, so a tester can run the
  # change before it is merged. See documentation/PREVIEW_BUILDS.md.
  workflow_call:
    inputs:
      pr_number:
        description: Pull request to publish preview images for, tagged pr-<number>
        type: number
        required: true
      pr_commit:
        description: >-
          For a pull request from a fork, built by hand: the commit of the pull request a
          maintainer reviewed. GitHub's merge of exactly that commit into main is built.
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: The version the preview images carry
        value: ${{ jobs.version.outputs.version }}
      ref:
        description: The commit the images were built from when it is not the run's own (a fork's preview)
        value: ${{ jobs.version.outputs.ref }}

# A newer push to a PR makes its running build pointless; on main and tags a build is never cut
# off halfway through publishing, the next one waits instead. A preview has a group of its own,
# so it never cancels the run that tries a change to this file on the same pull request. Every
# run that can move latest (a tag, the weekly rebuild, a manual release rebuild) shares one
# group, so two of them never write latest at the same time.
concurrency:
  group: docker-publish-${{ !(inputs.pr_number > 0) && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target != 'main')) && 'release' || github.ref }}${{ inputs.pr_number > 0 && '-preview' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default; each job asks for exactly what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# What a run publishes, and under which tags:
#   push to main, or a manual run for main: main, as edge and sha-<commit>. Users who want every
#     merge run edge; latest never follows main.
#   push of a vX.Y.Z tag: that release, as X.Y.Z, X.Y, X and sha-<commit>, and as latest when
#     it is the newest release (an older patch release leaves latest alone). A pre-release tag
#     (v1.2.3-rc.1) gets its own version tag only.
#   weekly rebuild, or a manual run for the release: the newest release again, from its tag,
#     with today's OS packages, under the same tags as when it was released, latest included.
#   preview: the pull request, as pr-<number>; see preview-build.yml. A fork's pull request is
#     built by hand (pr_commit), from main's run: it never writes the build cache.
#
# How an image gets published, by kind of run:
#   release (push to main, tag, schedule, manual run): every architecture is built on its own
#     hardware and pushed by digest only, with no tag. The merge job then ties the digests into
#     one tagged multi-architecture index and signs that index. Provenance and SBOM are made per
#     architecture by the build.
#   preview (pull request labelled test-build, or a fork's built by hand): amd64 only, pushed
#     with its pr-<number> tags straight from the build. The cleanup in preview-cleanup.yml
#     deletes package versions by tag, and the per-architecture manifests of a
#     multi-architecture image carry none, so previews stay single-architecture for now.
#   pull request that changes this file: both architectures build, nothing is pushed.
#
# A fork publishes nothing: its pushes, schedule and manual runs skip every job, so its CI stays
# green without packages permission. A fork that wants its own images sets the repository
# variable PUBLISH_IMAGES to true; they go to ghcr.io/<its owner, lowercase>.
jobs:
  # One version for every architecture of every image, however long each build takes.
  version:
    name: Resolve version
    # build and merge need this job, so skipping it skips them too.
    if: github.event_name == 'pull_request' || github.repository == 'joszz/GarageStack' || vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # GHCR image names are lowercase; an owner such as SomeUser is not.
      owner: ${{ steps.owner.outputs.name }}
      version: ${{ steps.minver.outputs.version }}
      patch_date: ${{ steps.patchdate.outputs.date }}
      ref: ${{ steps.target.outputs.ref }}
      revision: ${{ steps.target.outputs.revision }}
      short_sha: ${{ steps.target.outputs.short_sha }}
      release: ${{ steps.target.outputs.release }}
      latest: ${{ steps.target.outputs.latest }}
      edge: ${{ steps.target.outputs.edge }}
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_COMMIT: ${{ inputs.pr_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Decides what this run builds and which tags it moves; see the overview above the jobs.
      # A rebuild of the newest release checks its tag out here, so MinVer below reads the
      # release's own version, and passes the tag on as ref for the builds to check out. A fork's
      # preview does the same with GitHub's merge of the reviewed commit.
      - name: Pick what to build
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          PR_HEAD_SHA: ${{ inputs.pr_commit || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The newest release: the highest vX.Y.Z tag, pre-releases left out.
          NEWEST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          CHECKOUT_REF=""
          RELEASE=""
          LATEST=false
          EDGE=false
          if [ -n "$PR_COMMIT" ]; then
            # A fork's preview, started by hand: GitHub's merge of the pull request into main, as
            # a labelled pull request from this repository builds, but only while it is the merge
            # of the commit the maintainer reviewed. A push since then stops it here.
            if ! [[ "$PR_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "${PR_NUMBER:-0}" -le 0 ]; then
              echo "::error::A fork's preview needs the pull request number and the full 40-character commit" >&2
              exit 1
            fi
            git fetch --quiet origin "+refs/pull/$PR_NUMBER/merge:refs/remotes/origin/preview-merge"
            CHECKOUT_REF=$(git rev-parse refs/remotes/origin/preview-merge)
            MERGED=$(git rev-parse "$CHECKOUT_REF^2")
            if [ "$MERGED" != "$PR_COMMIT" ]; then
              echo "::error::GitHub's merge of #$PR_NUMBER is built from $MERGED, not $PR_COMMIT. Either the pull request moved on (review the new commits and run again with its new head), or GitHub has not updated the merge yet (run again in a minute)." >&2
              exit 1
            fi
            git checkout --quiet --detach "$CHECKOUT_REF"
          elif [ "${PR_NUMBER:-0}" -gt 0 ] || [ "$EVENT" = pull_request ]; then
            # A preview, or a pull request that only tries this file: no release tags.
            :
          elif [ "$EVENT" = push ] && [[ "$REF" == refs/tags/v* ]]; then
            RELEASE="$REF_NAME"
            if [ "$RELEASE" = "$NEWEST" ]; then LATEST=true; fi
          elif [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$TARGET" != main ]; }; then
            if [ -z "$NEWEST" ]; then
              echo "There is no release to rebuild" >&2
              exit 1
            fi
            RELEASE="$NEWEST"
            LATEST=true
            CHECKOUT_REF="refs/tags/$NEWEST"
            git checkout --quiet --detach "$CHECKOUT_REF"
          elif [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            EDGE=true
          else
            echo "Only $DEFAULT_BRANCH publishes edge, not $REF" >&2
            exit 1
          fi
          # The commit the images are built from. A preview names the pull request's own commit,
          # as its pr-<number>-<sha> tag does, not GitHub's merge commit.
          REVISION="${PR_HEAD_SHA:-$(git rev-parse HEAD)}"
          {
            echo "ref=$CHECKOUT_REF"
            echo "revision=$REVISION"
            echo "short_sha=${REVISION:0:7}"
            echo "release=$RELEASE"
            echo "latest=$LATEST"
            echo "edge=$EDGE"
          } >> "$GITHUB_OUTPUT"
          echo "Building $REVISION: release '${RELEASE:-none}', latest $LATEST, edge $EDGE"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Compute MinVer version
        id: minver
        shell: bash
        run: |
          # Same MinVer the build uses to stamp the assemblies, read from the central pin so
          # the image tag and the version inside it can never come from different majors.
          MINVER_VERSION=$(sed -n 's/.*Include="MinVer" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)
          if [ -z "$MINVER_VERSION" ]; then
            echo "Could not read the MinVer version from Directory.Packages.props" >&2
            exit 1
          fi
          dotnet tool install --global minver-cli --version "$MINVER_VERSION"
          VERSION=$(minver . -t v -p preview.0 | tail -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "MinVer produced an empty version" >&2
            exit 1
          fi
          # A preview names its pull request in the version, so the footer shows which build runs.
          if [ "${PR_NUMBER:-0}" -gt 0 ]; then
            case "$VERSION" in
              *-*) VERSION="$VERSION.pr.$PR_NUMBER" ;;
              *) VERSION="$VERSION-pr.$PR_NUMBER" ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved MinVer version: $VERSION"

      # Taken once here, so both architectures of an image carry the same date even when a
      # build crosses midnight UTC.
      - name: Compute OS patch date
        id: patchdate
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Image owner
        id: owner
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }} (${{ matrix.arch }})
    needs: version
    # Each architecture builds on its own hardware: emulating arm64 would run the .NET build and
    # the apt installs under QEMU. The arm64 runner is free for a public repository.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    # No id-token: signing happens in the merge job.
    permissions:
      contents: read
      packages: write
    env:
      # Whether images are pushed: always, except on a pull request that is not a preview.
      PUBLISH: ${{ github.event_name != 'pull_request' || inputs.pr_number > 0 }}
      # A preview is a throwaway test build: no SBOM, provenance or signature, which would each
      # leave untagged versions in the registry that the cleanup cannot tell apart. It is also
      # the only kind of run that pushes tags from the build itself; see the notes above. A fork's
      # preview runs as a workflow_dispatch, so the pull request number decides, not the event.
      RELEASE_GRADE: ${{ github.event_name != 'pull_request' && !(inputs.pr_number > 0) }}

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        label: [all-in-one, frontend, api, worker]
        # A preview is amd64 only.
        arch: ${{ fromJSON(inputs.pr_number > 0 && '["amd64"]' || '["amd64","arm64"]') }}
        include:
          # All-in-one image (frontend + API + worker + postgres + mosquitto + saic gateway)
          - label: all-in-one
            image: garagestack
            context: .
            dockerfile: docker/all-in-one/Dockerfile

          # Individual service images (used with docker-compose)
          - label: frontend
            image: garagestack-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile

          - label: api
            image: garagestack-api
            context: .
            dockerfile: src/GarageStack.Api/Dockerfile

          - label: worker
            image: garagestack-worker
            context: .
            dockerfile: src/GarageStack.Worker/Dockerfile

    steps:
      # A rebuild of the newest release builds its tag; every other run builds its own ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.ref }}

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || github.token }}"
          echo "$TOKEN" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: GHCR auth preflight
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.image }}"
          SCOPE="repository:${{ needs.version.outputs.owner }}/${IMAGE}:pull,push"
          STATUS=$(curl -sS -o /tmp/ghcr-token.json -w "%{http_code}" \
            -u "${{ github.actor }}:${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || github.token }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=${SCOPE}")

          if [ "$STATUS" -ge 400 ] || ! grep -q '"token"' /tmp/ghcr-token.json; then
            echo "::error::GHCR auth preflight failed. Token does not have ghcr pull/push for ${{ needs.version.outputs.owner }}/${IMAGE}."
            echo "::error::Check repo Actions permissions (Read and write), package access, or configure GHCR_PAT with write:packages/read:packages."
            cat /tmp/ghcr-token.json
            exit 1
          fi

      - name: Log in to Docker Hub (avoids pull rate limits for moby/buildkit)
        if: env.PUBLISH == 'true'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The labels come from here for every kind of run, so both architectures of an image carry
      # the same ones. The tags are used only when the build pushes them itself (a preview).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}
          # Keep this tag list the same as the one in the merge job.
          flavor: latest=false
          labels: org.opencontainers.image.revision=${{ needs.version.outputs.revision }}
          tags: |
            # edge on every push to main: the build to run to try main before it is released
            type=raw,value=edge,enable=${{ needs.version.outputs.edge == 'true' }}
            # latest only for the newest release, never for main
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}
            # semver tags from the release being built: v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}},value=${{ needs.version.outputs.release }},enable=${{ needs.version.outputs.release != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.release }},enable=${{ needs.version.outputs.release != '' }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.release }},enable=${{ needs.version.outputs.release != '' }}
            # short SHA of the commit built, for traceability
            type=raw,value=sha-${{ needs.version.outputs.short_sha }},enable=${{ !(inputs.pr_number > 0) }}
            # a preview: pr-123 follows the pull request, pr-123-abc1234 is one exact commit. The
            # commit is the pull request's own (revision), not GitHub's merge of it, and not the
            # run's: a fork's preview runs on main.
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number > 0 }}
            type=raw,value=pr-${{ inputs.pr_number }}-${{ needs.version.outputs.short_sha }},enable=${{ inputs.pr_number > 0 }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # A preview pushes its tags from here; a release pushes by digest below.
          push: ${{ env.PUBLISH == 'true' && env.RELEASE_GRADE != 'true' }}
          tags: ${{ env.RELEASE_GRADE != 'true' && steps.meta.outputs.tags || '' }}
          # By digest only, no tag: the merge job tags the index that ties the architectures.
          outputs: ${{ env.RELEASE_GRADE == 'true' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, needs.version.outputs.owner, matrix.image) || '' }}
          provenance: ${{ env.RELEASE_GRADE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.RELEASE_GRADE == 'true' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            OS_PATCH_DATE=${{ needs.version.outputs.patch_date }}
          # Each image gets its own GHA cache scope, and each architecture its own, so the two
          # do not evict each other. amd64 keeps the scope it always had. A fork's preview runs on
          # main, so what it wrote would be main's cache, which the releases build from: it reads
          # the cache and writes none.
          cache-from: type=gha,scope=${{ matrix.label }}${{ matrix.arch != 'amd64' && format('-{0}', matrix.arch) || '' }}
          cache-to: ${{ inputs.pr_commit == '' && format('type=gha,scope={0}{1},mode=min,ignore-error=true', matrix.label, matrix.arch != 'amd64' && format('-{0}', matrix.arch) || '') || '' }}

      - name: Export digest
        if: env.RELEASE_GRADE == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "The build produced no digest" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.RELEASE_GRADE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.label }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # A digest is a few bytes. A week lets "Re-run failed jobs" still find the digests of
          # the builds that succeeded.
          retention-days: 7

  # Ties the per-architecture images of each image into one tagged index and signs it. It runs
  # for releases only, and only for an image whose builds all succeeded, so a release never
  # publishes an image for some architectures and not others.
  merge:
    name: Publish ${{ matrix.label }}
    # !cancelled() lets an image whose own builds succeeded publish even when another image's
    # build failed, as each image did before. Without a status function, one failed build of
    # any image or architecture would skip every merge, amd64 included. An image with an
    # architecture missing still fails here, on the digest count.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !(inputs.pr_number > 0) && needs.build.result != 'skipped' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all-in-one
            image: garagestack
          - label: frontend
            image: garagestack-frontend
          - label: api
            image: garagestack-api
          - label: worker
            image: garagestack-worker
    env:
      # The workflow-level env is not available here, so the registry is spelled out.
      IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/${{ matrix.image }}
      # linux/amd64 and linux/arm64, the architectures of the build matrix.
      EXPECTED_DIGESTS: 2
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.label }}-*
          merge-multiple: true

      # The token and the user go in through the environment, not into the script text.
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          TOKEN: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The annotations go on the index: GHCR shows a multi-architecture image's
          # description from the index, not from the labels inside each image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # Keep this tag list the same as the one in the build job.
          flavor: latest=false
          labels: org.opencontainers.image.revision=${{ needs.version.outputs.revision }}
          tags: |
            # edge on every push to main: the build to run to try main before it is released
            type=raw,value=edge,enable=${{ needs.version.outputs.edge == 'true' }}
            # latest only for the newest release, never for main
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}
            # semver tags from the release being built: v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}},value=${{ needs.version.outputs.release }},enable=${{ needs.version.outputs.release != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.release }},enable=${{ needs.version.outputs.release != '' }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.release }},enable=${{ needs.version.outputs.release != '' }}
            # short SHA of the commit built, for traceability
            type=raw,value=sha-${{ needs.version.outputs.short_sha }}

      - name: Create the multi-architecture index
        id: index
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          # One file per architecture, named by its digest. Fewer would publish an index that
          # silently misses an architecture.
          DIGESTS=(*)
          if [ "${#DIGESTS[@]}" -ne "$EXPECTED_DIGESTS" ]; then
            echo "Expected $EXPECTED_DIGESTS digests, found ${#DIGESTS[@]}" >&2
            exit 1
          fi
          SOURCES=()
          for D in "${DIGESTS[@]}"; do SOURCES+=("$IMAGE@sha256:$D"); done
          TAG_ARGS=()
          while IFS= read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(-t "$TAG"); fi
          done <<< "$TAGS"
          if [ "${#TAG_ARGS[@]}" -eq 0 ]; then
            echo "No tags to publish" >&2
            exit 1
          fi
          # One per line, each already prefixed with index: by the metadata step.
          ANNOTATION_ARGS=()
          while IFS= read -r ANNOTATION; do
            if [ -n "$ANNOTATION" ]; then ANNOTATION_ARGS+=(--annotation "$ANNOTATION"); fi
          done <<< "$ANNOTATIONS"
          METADATA="$RUNNER_TEMP/index-metadata.json"
          docker buildx imagetools create --metadata-file "$METADATA" \
            "${TAG_ARGS[@]}" "${ANNOTATION_ARGS[@]}" "${SOURCES[@]}"

          # The digest of the index this run just created, from the create itself. Reading it
          # back through a tag could return another run's index: a push to main and a tag on the
          # same commit both write sha-<commit>.
          INDEX_DIGEST=$(jq -r '."containerimage.descriptor".digest // ."containerimage.digest" // empty' "$METADATA")
          case "$INDEX_DIGEST" in
            sha256:*) ;;
            *) echo "No index digest in the create metadata" >&2; exit 1 ;;
          esac
          echo "digest=$INDEX_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check the index
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          # GHCR can answer "not found" for a few seconds after the create pushed the index
          # (seen on the 2026-11-18 main publish, which also skipped the signing below). Only
          # reading it is retried: an index without both architectures fails at once.
          ATTEMPTS=6
          for ATTEMPT in $(seq 1 "$ATTEMPTS"); do
            if RAW=$(docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw); then
              break
            fi
            if [ "$ATTEMPT" -eq "$ATTEMPTS" ]; then
              echo "The registry still does not serve $IMAGE@$INDEX_DIGEST after $ATTEMPTS tries" >&2
              exit 1
            fi
            echo "The registry does not serve the index yet; trying again in $((ATTEMPT * 5)) s" >&2
            sleep $((ATTEMPT * 5))
          done
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST"
          # Both architectures must be in the index the tags now point to.
          jq -e '[.manifests[] | .platform // empty | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])' \
            <<< "$RAW" > /dev/null

      # The index is signed, which covers every tag, and with --recursive each manifest in it as
      # well, so a check against one architecture's own digest (what a host pulls) also finds a
      # signature.
      - name: Sign image with Cosign
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$INDEX_DIGEST"
