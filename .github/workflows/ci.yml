name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Exact tag: the floating v6 tag still points at 6.0.10, which predates pnpm 12 support.
      - uses: pnpm/action-setup@v6.1.0
        with:
          # Version comes from frontend/package.json's packageManager field.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: |
          pnpm run lint
          git diff --exit-code

      - name: Format check
        working-directory: frontend
        run: pnpm exec prettier --check src/ e2e/

  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Exact tag: the floating v6 tag still points at 6.0.10, which predates pnpm 12 support.
      - uses: pnpm/action-setup@v6.1.0
        with:
          # Version comes from frontend/package.json's packageManager field.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: pnpm run type-check

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Exact tag: the floating v6 tag still points at 6.0.10, which predates pnpm 12 support.
      - uses: pnpm/action-setup@v6.1.0
        with:
          # Version comes from frontend/package.json's packageManager field.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm run test:unit --run

  # Runs the production bundle behind the production nginx config, which is the only place the
  # Content-Security-Policy applies. Unit tests and the type checker cannot see that far: a
  # policy violation once shipped to main with every other check green.
  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Exact tag: the floating v6 tag still points at 6.0.10, which predates pnpm 12 support.
      - uses: pnpm/action-setup@v6.1.0
        with:
          # Version comes from frontend/package.json's packageManager field.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the demo stack
        run: |
          cp .env.demo.example .env.demo
          docker compose -f docker-compose.demo.yml up -d --build

      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/auth/config > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the demo stack did not become reachable"
          docker compose -f docker-compose.demo.yml logs --tail 50
          exit 1

      - name: Run smoke tests
        working-directory: frontend
        run: pnpm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop the demo stack
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Warnings are errors and the .NET analyzers run as part of the build above; this step
      # covers what the build cannot: whitespace, using order and the other .editorconfig rules.
      - name: Format check
        run: dotnet format GarageStack.slnx --verify-no-changes --no-restore

      # A model change without a migration would only surface at MigrateAsync on a real
      # database. The Data project carries its own design-time factory, so no API config is needed.
      - name: EF model matches migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/GarageStack.Data --startup-project src/GarageStack.Data --no-build --configuration Release

  container-build:
    name: Container build (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all-in-one
            context: .
            dockerfile: docker/all-in-one/Dockerfile
          - label: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - label: api
            context: .
            dockerfile: src/GarageStack.Api/Dockerfile
          - label: worker
            context: .
            dockerfile: src/GarageStack.Worker/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (avoids pull rate limits)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha,scope=ci-${{ matrix.label }}
          cache-to: type=gha,scope=ci-${{ matrix.label }},mode=min
