name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  project-rules:
    name: Project rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The project writes no em dashes anywhere: code, comments, docs or translations.
      - name: No em dashes
        run: |
          if git grep -n "$(printf '\342\200\224')" -- . ':!frontend/pnpm-lock.yaml'; then
            echo "::error::Em dashes found. Use a comma, colon, semicolon or full stop instead."
            exit 1
          fi

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        working-directory: frontend
        run: |
          pnpm run lint
          git diff --exit-code

      - name: Format check
        working-directory: frontend
        run: pnpm exec prettier --check src/ e2e/

  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Type-check
        working-directory: frontend
        run: pnpm run type-check

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Run tests
        working-directory: frontend
        run: pnpm run test:coverage

      # Reported, not enforced: the figure is there to watch, not yet a gate.
      - name: Coverage summary
        if: always()
        working-directory: frontend
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          # shellcheck disable=SC2016 # the ${...} below are JavaScript template literals
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            for (const line of ["### Frontend coverage", "", "| | Covered | |", "| --- | --- | --- |"])
              console.log(line)
            for (const k of ["lines", "branches", "functions", "statements"])
              console.log(`| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`)
          ' >> "$GITHUB_STEP_SUMMARY"

  # Runs the production bundle behind the production nginx config, which is the only place the
  # Content-Security-Policy applies. Unit tests and the type checker cannot see that far: a
  # policy violation once shipped to main with every other check green.
  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      # The browser download is cached per Playwright version; its system libraries are not
      # cacheable, so a cache hit still installs those.
      - name: Read the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Start the demo stack
        run: |
          cp .env.demo.example .env.demo
          docker compose --env-file .env.demo -f docker-compose.demo.yml up -d --build

      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/auth/config > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the demo stack did not become reachable"
          docker compose --env-file .env.demo -f docker-compose.demo.yml logs --tail 50
          exit 1

      - name: Run smoke tests
        working-directory: frontend
        run: pnpm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop the demo stack
        if: always()
        run: docker compose --env-file .env.demo -f docker-compose.demo.yml down -v

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The PostgreSQL tests (src/GarageStack.Tests/Postgres) run against the same major version the
    # images bundle. Without a server they fail here rather than skip.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GARAGESTACK_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: >-
          dotnet test --no-restore --verbosity normal
          --coverage --coverage-output-format cobertura
          --coverage-settings src/GarageStack.Tests/coverage.settings.xml
          --results-directory TestResults

      # Reported, not enforced: the figure is there to watch, not yet a gate.
      - name: Coverage summary
        if: always()
        run: |
          report=$(find TestResults -name '*.cobertura.xml' 2>/dev/null | head -1)
          [ -n "$report" ] || exit 0
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          pct = lambda e: f"{float(e.get('line-rate')) * 100:.1f}%"
          for line in ["### Backend coverage", "", "| Assembly | Lines |", "| --- | --- |"]:
              print(line)
          print(f"| **All** | **{pct(root)}** |")
          for package in root.iter("package"):
              print(f"| {package.get('name')} | {pct(package)} |")
          PY

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Warnings are errors and the .NET analyzers run as part of the build above; this step
      # covers what the build cannot: whitespace, using order and the other .editorconfig rules.
      - name: Format check
        run: dotnet format GarageStack.slnx --verify-no-changes --no-restore

      # A model change without a migration would only surface at MigrateAsync on a real
      # database. The Data project carries its own design-time factory, so no API config is needed.
      - name: EF model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/GarageStack.Data --startup-project src/GarageStack.Data --no-build --configuration Release

  # Pull requests only: on main, docker-publish.yml builds and publishes these same images. The
  # "Protect main" ruleset requires these checks, so they stay here rather than there.
  container-build:
    name: Container build (${{ matrix.label }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all-in-one
            context: .
            dockerfile: docker/all-in-one/Dockerfile
          - label: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - label: api
            context: .
            dockerfile: src/GarageStack.Api/Dockerfile
          - label: worker
            context: .
            dockerfile: src/GarageStack.Worker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub (avoids pull rate limits)
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha,scope=ci-${{ matrix.label }}
          cache-to: type=gha,scope=ci-${{ matrix.label }},mode=min

  infra-lint:
    name: Shell, Dockerfile and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt             koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -x

      - name: hadolint
        run: |
          git ls-files -z '*Dockerfile' | xargs -0 docker run --rm -v "$PWD:/repo" -w /repo             hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e hadolint

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
