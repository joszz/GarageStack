# The API derives its own public URL (the OpenID Connect redirect URI, above all) from the
# forwarded request headers, so they have to describe the URL the browser actually used.
# This server always listens on plain HTTP, so $scheme alone would report "http" even when a
# TLS-terminating proxy sits in front -- prefer that proxy's X-Forwarded-Proto when present.
map $http_x_forwarded_proto $garagestack_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers, shared with the frontend image (frontend/nginx-security-headers.conf).
    # Every location below that sets its own add_header must include this file again, because
    # nginx does not inherit add_header into such a location.
    include /etc/nginx/snippets/garagestack-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # GarageStack API -- .NET process listens on localhost:9000
    location /api/ {
        proxy_pass http://127.0.0.1:9000/api/;
        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, and a redirect URI missing the port is
        # rejected by the identity provider.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
    }

    # SignalR WebSocket hubs
    location /hubs/ {
        proxy_pass http://127.0.0.1:9000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
        proxy_read_timeout 86400;
    }

    # OpenAPI spec and Scalar UI
    location /openapi {
        proxy_pass http://127.0.0.1:9000/openapi;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
    }

    # SPA -- all unmatched paths fall back to index.html
    location / {
        include /etc/nginx/snippets/garagestack-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # SW and manifest must never be HTTP-cached: the browser needs to fetch
    # them fresh on every load to detect app updates. Long-caching these causes
    # the SW to keep precaching stale asset hashes after a new deployment.
    location = /sw.js {
        include /etc/nginx/snippets/garagestack-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        include /etc/nginx/snippets/garagestack-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/garagestack-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/garagestack-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
