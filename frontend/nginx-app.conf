# Everything inside the server block that the frontend image (frontend/nginx.conf) and the
# all-in-one image (docker/all-in-one/nginx.conf) share. Each includes it from its own server
# block, after setting $api_upstream to where its API listens: proxy_pass with a variable and no
# path passes the request URI on unchanged.
#
# The security headers are included again in every location that sets its own add_header,
# because nginx does not inherit add_header into such a location.

# Text is sent compressed. The build writes a .gz beside every larger file (see
# frontend/scripts/precompress.mjs), compressed once at the highest level, and gzip_static
# serves that instead of compressing each response again; anything without one, the API's
# JSON included, is compressed on the fly.
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml image/svg+xml;

location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # $http_host, not $host: $host drops the port, and a redirect URI missing the port is
    # rejected by the identity provider.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
}

# SignalR WebSocket hubs
location /hubs/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
    proxy_read_timeout 86400;
}

location / {
    include /etc/nginx/snippets/garagestack-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
}

# SW and manifest must never be HTTP-cached: the browser needs to fetch
# them fresh on every load to detect app updates. Long-caching these causes
# the SW to keep precaching stale asset hashes after a new deployment.
location = /sw.js {
    include /etc/nginx/snippets/garagestack-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location = /registerSW.js {
    include /etc/nginx/snippets/garagestack-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location = /manifest.webmanifest {
    include /etc/nginx/snippets/garagestack-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # mime.types has no entry for .webmanifest, so it went out as application/octet-stream.
    # With the types emptied here, default_type names it instead.
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
}

# Vite's build output: every file name carries a content hash, so a release brings new URLs
# and these can be cached for good.
location ^~ /assets/ {
    include /etc/nginx/snippets/garagestack-security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# The icons and screenshots from public/ keep their names across releases, so a changed
# one has to reach browsers within a day rather than a year.
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    include /etc/nginx/snippets/garagestack-security-headers.conf;
    expires 1d;
}
