# The API derives its own public URL (the OpenID Connect redirect URI, above all) from the
# forwarded request headers, so they have to describe the URL the browser actually used.
# This server always listens on plain HTTP, so $scheme alone would report "http" even when a
# TLS-terminating proxy sits in front -- prefer that proxy's X-Forwarded-Proto when present.
map $http_x_forwarded_proto $garagestack_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The nginx version stays out of the Server header and error pages. (Debian's nginx.conf in the
# all-in-one image already says so; the official nginx image's does not.)
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve Docker service names so api container restarts do not leave nginx
    # pinned to a stale container IP (which causes intermittent 502 errors).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Security headers. Every location below that sets its own add_header must include this
    # file again, because nginx does not inherit add_header into such a location.
    include /etc/nginx/snippets/garagestack-security-headers.conf;

    # Where the API container answers. Through a variable, so nginx resolves the name with the
    # resolver above instead of once at startup.
    set $api_upstream http://api:8080;

    include /etc/nginx/snippets/garagestack-app.conf;
}
