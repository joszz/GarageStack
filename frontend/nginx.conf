# The API derives its own public URL (the OpenID Connect redirect URI, above all) from the
# forwarded request headers, so they have to describe the URL the browser actually used.
# This server always listens on plain HTTP, so $scheme alone would report "http" even when a
# TLS-terminating proxy sits in front -- prefer that proxy's X-Forwarded-Proto when present.
map $http_x_forwarded_proto $garagestack_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve Docker service names so api container restarts do not leave nginx
    # pinned to a stale container IP (which causes intermittent 502 errors).
    resolver 127.0.0.11 ipv6=off valid=30s;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; child-src 'none'; navigate-to 'self'; script-src 'self' 'sha256-MsyHDz2Q9MM6DjmYjpACXTrSgtFF+tutkPYzSbPmHwA='; script-src-elem 'self' 'sha256-MsyHDz2Q9MM6DjmYjpACXTrSgtFF+tutkPYzSbPmHwA='; script-src-attr 'none'; style-src 'self'; style-src-elem 'self' 'sha256-IjDBH01/QEhAptpG1bqDVKT5WXiu63d/qZH2r6WdVO0='; style-src-attr 'none'; img-src 'self' data: https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; prefetch-src 'self'; upgrade-insecure-requests; block-all-mixed-content" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, and a redirect URI missing the port is
        # rejected by the identity provider.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
    }

    # SignalR WebSocket hubs
    location /hubs/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $garagestack_forwarded_proto;
        proxy_read_timeout 86400;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # SW and manifest must never be HTTP-cached: the browser needs to fetch
    # them fresh on every load to detect app updates. Long-caching these causes
    # the SW to keep precaching stale asset hashes after a new deployment.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
