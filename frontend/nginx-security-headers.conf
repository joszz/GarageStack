# Security response headers for every response the frontend nginx serves.
#
# Included from the server block AND from every location that declares its own add_header:
# nginx drops all inherited add_header directives as soon as a location defines one of its
# own (for example the Cache-Control on the SPA fallback), which previously left index.html,
# the service worker and every static asset without a Content-Security-Policy.
#
# Shared by the frontend image (frontend/nginx.conf) and the all-in-one image
# (docker/all-in-one/nginx.conf). The two sha256 hashes belong to the inline style and script
# that vite.config.ts injects to defer the main stylesheet; change them there and here together.
#
# The map needs more than 'self': tiles.openfreemap.org serves the vector basemap (its style,
# tiles, fonts and sprites all go through fetch, hence connect-src), tile.openstreetmap.org
# serves the raster tiles used when WebGL is missing, and MapLibre runs its tile decoder in a
# worker created from a blob URL, which worker-src (child-src for older Safari) must allow.
# A deployment pointing VITE_MAP_STYLE_* at its own tile server has to add that host here too.
add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; child-src blob:; script-src 'self' 'sha256-MsyHDz2Q9MM6DjmYjpACXTrSgtFF+tutkPYzSbPmHwA='; script-src-elem 'self' 'sha256-MsyHDz2Q9MM6DjmYjpACXTrSgtFF+tutkPYzSbPmHwA='; script-src-attr 'none'; style-src 'self'; style-src-elem 'self' 'sha256-IjDBH01/QEhAptpG1bqDVKT5WXiu63d/qZH2r6WdVO0='; style-src-attr 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; manifest-src 'self'; worker-src 'self' blob:; media-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
