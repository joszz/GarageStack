# The security response headers every response gets, apart from the Content-Security-Policy.
#
# nginx-security-headers.conf includes this file and adds the app's policy to it. The API
# reference (/api/reference, see nginx-app.conf) includes only this file: the API sends that
# page a policy of its own, and a second policy from here would be enforced on top of it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
