services:
  api:
    build:
      context: .
      dockerfile: src/GarageStack.Api/Dockerfile
    container_name: garagestack-api-demo
    restart: unless-stopped
    environment:
      # Everything the container gets is listed here; compose reads .env.demo for the ${...}
      # placeholders on its own, as the production compose file does.
      ASPNETCORE_ENVIRONMENT: "Production"
      DEMO_MODE: "true"
      DEBUG_LOGS: "${DEBUG_LOGS:-false}"
      Cors__Origins__0: "${CORS_ORIGIN:-http://localhost:8080}"
      Auth__Username: "${AUTH_USERNAME:-demo}"
      Auth__Password: "${AUTH_PASSWORD:-demo}"
      # The browser smoke tests drive several pages in parallel from one address, which is far
      # more traffic than the default per-IP budget is sized for.
      RateLimits__GlobalPerMinute: "${RATE_LIMIT_GLOBAL_PER_MINUTE:-2000}"
    ports:
      - "127.0.0.1:${API_PORT:-5001}:8080"
    volumes:
      - api_demo_logs:/app/logs
      - api_demo_dataprotection:/app/keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "true"
    container_name: garagestack-frontend-demo
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  api_demo_logs:
  api_demo_dataprotection:
