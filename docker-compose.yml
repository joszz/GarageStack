# Settings both .NET services need. Compose reads .env for ${...} interpolation on its own, so
# every value a container gets is listed explicitly here: no env_file, and no secret reaching a
# container that has no use for it (the Worker never sees the OIDC or widget credentials, the API
# never sees the notification language).
#
# The variables go through under the names .env uses; the services map each one onto its setting
# (src/GarageStack.Core/Configuration/EnvironmentAliases.cs). Unset ones arrive empty, which the
# services read as "use the default", so the defaults live in the app and are not restated here.
# The few defaults below are this deployment's own: its service names and plain HTTP.
x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: "Production"
  DEBUG_LOGS: "${DEBUG_LOGS:-}"
  ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-garagestack};Username=${POSTGRES_USER:-garagestack};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file, see .env.example}"
  MQTT_HOST: "${MQTT_HOST:-mosquitto}"
  MQTT_PORT: "${MQTT_PORT:-}"
  MQTT_BROKER_USERNAME: "${MQTT_BROKER_USERNAME:-garagestack}"
  MQTT_BROKER_PASSWORD: "${MQTT_BROKER_PASSWORD:?Set MQTT_BROKER_PASSWORD in your .env file, see .env.example}"
  VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
  VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
  Vapid__Subject: "mailto:${SAIC_USER}"
  # Colour-coding and notification thresholds (bar); the API paints them, the Worker alerts on them.
  TYRE_PRESSURE_LOW_BAR: "${TYRE_PRESSURE_LOW_BAR:-}"
  TYRE_PRESSURE_GOOD_BAR: "${TYRE_PRESSURE_GOOD_BAR:-}"
  TYRE_PRESSURE_HIGH_BAR: "${TYRE_PRESSURE_HIGH_BAR:-}"
  # The POI map layers: the API serves them and the Worker pre-fetches them around the car, so
  # both need the same endpoint, key and speed camera switch. See .env.example.
  OVERPASS__BASEURL: "${OVERPASS__BASEURL:-}"
  SPEEDCAMERAS__ENABLED: "${SPEEDCAMERAS__ENABLED:-}"
  OPENCHARGEMAP_API_KEY: "${OPENCHARGEMAP_API_KEY:-}"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      MQTT_BROKER_USERNAME: "${MQTT_BROKER_USERNAME:-garagestack}"
      MQTT_BROKER_PASSWORD: "${MQTT_BROKER_PASSWORD:?Set MQTT_BROKER_PASSWORD in your .env file, see .env.example}"
      # Optional Home Assistant login, see documentation/HOME_ASSISTANT.md. Left empty, no HA user is created.
      HA_MQTT_USERNAME: "${HA_MQTT_USERNAME:-}"
      HA_MQTT_PASSWORD: "${HA_MQTT_PASSWORD:-}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /mosquitto-auth.sh /mosquitto/data && exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"]
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_EXTERNAL_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/mosquitto-auth.sh:/mosquitto-auth.sh:ro
      - mosquitto_data:/mosquitto/data/

  saic-mqtt-gateway:
    image: saicismartapi/saic-python-mqtt-gateway:0.12.0
    container_name: saic-mqtt
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - mosquitto
    environment:
      SAIC_USER: "${SAIC_USER}"
      SAIC_PASSWORD: "${SAIC_PASSWORD}"
      MQTT_URI: "tcp://mosquitto:1883"
      MQTT_USER: "${MQTT_BROKER_USERNAME:-garagestack}"
      MQTT_PASSWORD: "${MQTT_BROKER_PASSWORD:?Set MQTT_BROKER_PASSWORD in your .env file, see .env.example}"
      SAIC_REGION: "${SAIC_REGION:-eu}"
      SAIC_REST_URI: "${SAIC_REST_URI:-}"
    volumes:
      - ./docker/resolve-saic-rest-uri.sh:/resolve-saic-rest-uri.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: [". /resolve-saic-rest-uri.sh && exec python ./main.py"]

  # Bundled Postgres - only starts when you pass --profile bundled-postgres.
  # Skip this and set POSTGRES_HOST to your own server to reuse an existing instance.
  postgres:
    profiles:
      - bundled-postgres
    image: postgres:18-alpine
    container_name: garagestack-postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-garagestack}"
      POSTGRES_USER: "${POSTGRES_USER:-garagestack}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file, see .env.example}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garagestack} -d ${POSTGRES_DB:-garagestack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: src/GarageStack.Worker/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-0.0.0-local}"
    container_name: garagestack-worker
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/joszz/garagestack/main/frontend/public/pwa-192x192.png"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mosquitto:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      <<: *dotnet-environment
      # Language of push notification texts (en or nl); the Worker has no browser to ask.
      NOTIFICATION_LANGUAGE: "${NOTIFICATION_LANGUAGE:-}"
      # Days of telemetry kept at full detail before the Worker compacts it. See .env.example.
      TELEMETRY_FULL_DETAIL_DAYS: "${TELEMETRY_FULL_DETAIL_DAYS:-}"
    volumes:
      - worker_logs:/app/logs

  api:
    build:
      context: .
      dockerfile: src/GarageStack.Api/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-0.0.0-local}"
    container_name: garagestack-api
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/joszz/garagestack/main/frontend/public/pwa-192x192.png"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mosquitto:
        condition: service_started
    environment:
      <<: *dotnet-environment
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      SAIC_USER: "${SAIC_USER}"
      SAIC_PASSWORD: "${SAIC_PASSWORD}"
      # Built-in password login, used only when no OIDC provider is configured below. Left
      # empty, the API falls back to the MG account credentials above. Set
      # AUTH_PASSWORD_LOGIN_ENABLED=true to keep it available alongside OIDC as well.
      AUTH_USERNAME: "${AUTH_USERNAME:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      AUTH_PASSWORD_LOGIN_ENABLED: "${AUTH_PASSWORD_LOGIN_ENABLED:-}"
      # False keeps plain-HTTP installs working out of the box; set it to true behind HTTPS.
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_SESSION_LIFETIME_HOURS: "${AUTH_SESSION_LIFETIME_HOURS:-}"
      # OpenID Connect single sign-on -- see documentation/AUTHENTICATION.md. Setting OIDC_AUTHORITY switches
      # authentication over to the provider and disables the password login above, unless
      # AUTH_PASSWORD_LOGIN_ENABLED keeps it on.
      OIDC_AUTHORITY: "${OIDC_AUTHORITY:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-}"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-}"
      OIDC_AUTO_LOGIN: "${OIDC_AUTO_LOGIN:-}"
      OIDC_ALLOWED_GROUPS: "${OIDC_ALLOWED_GROUPS:-}"
      OIDC_ALLOWED_EMAILS: "${OIDC_ALLOWED_EMAILS:-}"
      OIDC_GROUPS_CLAIM: "${OIDC_GROUPS_CLAIM:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_REQUIRE_HTTPS_METADATA: "${OIDC_REQUIRE_HTTPS_METADATA:-}"
      WIDGET_API_KEY: "${WIDGET_API_KEY:-}"
      # Reverse geocoding for trip place names and the parked car's street, and snapping a
      # selected trip onto the roads it was driven on. Set ENABLED to false to keep coordinates
      # off a third-party service, or point BASEURL at your own instance. See .env.example.
      GEOCODING__ENABLED: "${GEOCODING__ENABLED:-}"
      GEOCODING__BASEURL: "${GEOCODING__BASEURL:-}"
      MAPMATCHING__ENABLED: "${MAPMATCHING__ENABLED:-}"
      MAPMATCHING__BASEURL: "${MAPMATCHING__BASEURL:-}"
      RATE_LIMIT_GLOBAL_PER_MINUTE: "${RATE_LIMIT_GLOBAL_PER_MINUTE:-}"
      # The traction battery's real capacity, which the MQTT gateway assumes rather than reads.
      # Left unset, a plug-in car keeps the gateway's figure and a hybrid shows charge as a
      # percentage only. See .env.example.
      HV_BATTERY_CAPACITY_KWH: "${HV_BATTERY_CAPACITY_KWH:-}"
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    volumes:
      - api_logs:/app/logs
      - api_dataprotection:/app/keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-0.0.0-local}"
    container_name: garagestack-frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/joszz/garagestack/main/frontend/public/pwa-192x192.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:80]/"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  mosquitto_data:
  worker_logs:
  api_logs:
  api_dataprotection:
